<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><title>Support Chat</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
  #log { border: 1px solid #ccc; height: 360px; overflow-y: auto; padding: 10px; margin-bottom: 8px; }
  .user { text-align: right; color: #0a58ca; } .bot { color: #222; }
  #in { width: 75%; padding: 8px; } button { padding: 8px 14px; }
</style>
</head>
<body>
<div id="log"></div>
<input id="in" placeholder="Type your question..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">Send</button>
<script>
const API = "http://127.0.0.1:8787"; // change to your deployed URL later
const history = [];
const log = document.getElementById("log");
const input = document.getElementById("in");

function add(cls, text) {
  const p = document.createElement("p");
  p.className = cls; p.textContent = text;
  log.appendChild(p); log.scrollTop = log.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  add("user", text);
  history.push({ role: "user", content: text });
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages: history }) });
    const data = await r.json();
    const reply = data.choices[0].message.content;
    history.push({ role: "assistant", content: reply });
    add("bot", reply);
  } catch (e) {
    console.error(e);
    add("bot", "Sorry, something went wrong. Please try again.");
  }
}
</script>
</body>
</html>
