<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanvico - Tư vấn trực tuyến</title>
<style>
  :root { --blue: #1e6fd9; --blue-dark: #1558b0; --blue-soft: #eaf2fd; --text: #1c2733; --muted: #7b8794; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff; color: var(--text); display: flex; justify-content: center; align-items: center;
  }
  .chat {
    width: 100%; max-width: 440px; height: 100dvh; max-height: 760px; display: flex; flex-direction: column;
    background: #fff; border: 1px solid #e3ebf5; border-radius: 20px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(30, 111, 217, .12);
  }
  @media (max-width: 480px) { .chat { max-height: none; border: 0; border-radius: 0; box-shadow: none; } }
  .head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid #e3ebf5; }
  .avatar, .mini {
    border-radius: 50%; flex: none; color: #fff; font-weight: 700;
    background: linear-gradient(135deg, #4a9bff, var(--blue-dark)); display: flex; align-items: center; justify-content: center;
  }
  .avatar { width: 42px; height: 42px; font-size: 18px; }
  .mini { width: 28px; height: 28px; font-size: 12px; }
  .head .name { font-weight: 600; font-size: 16px; line-height: 1.2; }
  .head .status { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3ccf6e; }
  #log { flex: 1; overflow-y: auto; padding: 18px 14px 8px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: flex-end; gap: 8px; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 76%; padding: 10px 15px; font-size: 15px; line-height: 1.42; white-space: pre-wrap; word-wrap: break-word; animation: pop .18s ease-out; }
  .bot .bubble { background: var(--blue-soft); border-radius: 20px 20px 20px 6px; }
  .user .bubble { background: linear-gradient(135deg, #3b8cf0, var(--blue-dark)); color: #fff; border-radius: 20px 20px 6px 20px; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.97); } to { opacity: 1; transform: none; } }
  .typing { display: flex; gap: 4px; padding: 14px 16px; background: var(--blue-soft); border-radius: 20px 20px 20px 6px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #8fb4e8; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .bar { padding: 10px 14px 14px; }
  .pill { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 18px; border: 1px solid #cfdcee; border-radius: 28px; }
  .pill:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(30, 111, 217, .12); }
  /* 16px stops iPhone Safari from zooming in when you tap the box */
  #in { flex: 1; border: 0; outline: 0; font-size: 16px; padding: 8px 0; background: transparent; color: var(--text); }
  #send { border: 0; background: transparent; color: var(--blue); font-weight: 600; font-size: 16px; padding: 8px 12px; cursor: pointer; border-radius: 20px; }
  #send:disabled { color: #b7c4d6; cursor: default; }
  #send:not(:disabled):hover { background: var(--blue-soft); }
</style>
</head>
<body>
<div class="chat">
  <div class="head">
    <div class="avatar">H</div>
    <div>
      <div class="name">Hanvico Support</div>
      <div class="status"><span class="dot"></span> Đang hoạt động</div>
    </div>
  </div>
  <div id="log" aria-live="polite"></div>
  <div class="bar">
    <div class="pill">
      <input id="in" placeholder="Nhắn tin..." autocomplete="off" aria-label="Nhập tin nhắn">
      <button id="send" disabled>Gửi</button>
    </div>
  </div>
</div>

<script>
const API = "https://api.mrnoobyesyes.workers.dev"; // keep the same URL you had before
const TIMEOUT_MS = 30000;
const history = [];
const log = document.getElementById("log");
const input = document.getElementById("in");
const sendBtn = document.getElementById("send");
let busy = false;

function addRow(who, text) {
  const row = document.createElement("div");
  row.className = "row " + who;
  if (who === "bot") {
    const m = document.createElement("div");
    m.className = "mini"; m.textContent = "H";
    row.appendChild(m);
  }
  const b = document.createElement("div");
  b.className = "bubble"; b.textContent = text;
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

function showTyping() {
  const row = document.createElement("div");
  row.className = "row bot";
  row.innerHTML = '<div class="mini">H</div><div class="typing"><span></span><span></span><span></span></div>';
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

function refreshBtn() { sendBtn.disabled = busy || !input.value.trim(); }

function errorText(status) {
  if (status === 429) return "Hiện có nhiều khách đang hỏi, bạn vui lòng thử lại sau ít phút nhé.";
  if (status === 403) return "Trang này chưa được phép dùng trợ lý. Bạn vui lòng liên hệ nhân viên Hanvico.";
  if (status === 408 || status === 504) return "Phản hồi hơi lâu, bạn gửi lại câu hỏi giúp mình nhé.";
  return "Xin lỗi, đã có lỗi xảy ra. Bạn vui lòng thử lại nhé.";
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  busy = true; refreshBtn();
  addRow("user", text);
  history.push({ role: "user", content: text });
  const typing = showTyping();
  try {
    const r = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
      signal: AbortSignal.timeout(TIMEOUT_MS),
    });
    if (!r.ok) throw { status: r.status };
    const data = await r.json();
    if (!data.reply) throw { status: 502 };
    history.push({ role: "assistant", content: data.reply });
    addRow("bot", data.reply);
  } catch (e) {
    console.error(e);
    history.pop(); // the failed question is not kept, so the customer can retype it
    addRow("bot", errorText(e && e.name === "TimeoutError" ? 408 : e && e.status));
  } finally {
    typing.remove();
    busy = false; refreshBtn(); input.focus();
  }
}

input.addEventListener("input", refreshBtn);
// do not send while a Vietnamese IME (Telex/VNI) is still composing a word
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);

addRow("bot", "Xin chào! Hanvico ấm áp như lòng mẹ 💙 Mình có thể giúp gì cho bạn hôm nay?");
input.focus();
</script>
</body>
</html>
